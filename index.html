<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisiGo - Home Eye Care Service</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/FLfp65gD/VISIGO-LOGO.png" />
  </head>
  <body>
    <div id="error-log" style="position: fixed; top: 0; left: 0; z-index: 9999; background: red; color: white; padding: 10px; display: none; white-space: pre-wrap; max-height: 50vh; overflow: auto;"></div>
    <script>
      window.addEventListener('error', (e) => {
        const el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerText += e.message + '\n' + (e.error ? e.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', (e) => {
        const el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerText += e.reason + '\n\n';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
